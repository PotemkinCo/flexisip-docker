name: auto-bump

on:
  workflow_dispatch:
  schedule:
    # Candidate discovery runs overnight; it never changes production.env.
    - cron: '0 3 * * *'

concurrency:
  group: flexisip-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  detect-and-update:
    name: detect upstream candidates
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout meta-repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read current versions
        id: current
        run: |
          set -euo pipefail
          . ./versions.env
          {
            echo "flexisip=$FLEXISIP_VERSION"
            echo "conference=$FLEXISIP_CONFERENCE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Find latest stable Flexisip tag
        id: latest-flexisip
        run: |
          set -euo pipefail
          echo "tag=$(./scripts/ci/latest-stable-tag.sh BC/public/flexisip BelledonneCommunications/flexisip)" >> "$GITHUB_OUTPUT"

      - name: Find latest stable conference tag
        id: latest-conference
        run: |
          set -euo pipefail
          echo "tag=$(./scripts/ci/latest-stable-tag.sh BC/public/flexisip-conference BelledonneCommunications/flexisip-conference)" >> "$GITHUB_OUTPUT"

      - name: Decide whether a candidate build is needed
        id: decide
        env:
          CUR_FLEXISIP: ${{ steps.current.outputs.flexisip }}
          CUR_CONFERENCE: ${{ steps.current.outputs.conference }}
          LATEST_FLEXISIP: ${{ steps.latest-flexisip.outputs.tag }}
          LATEST_CONFERENCE: ${{ steps.latest-conference.outputs.tag }}
        run: |
          set -euo pipefail
          built_flexisip=$(jq -r '.flexisip // empty' state/built.json)
          built_conference=$(jq -r '."flexisip-conference" // empty' state/built.json)
          update_flexisip=''
          update_conference=''

          if [[ "$LATEST_FLEXISIP" != "$CUR_FLEXISIP" ]]; then
            update_flexisip=$LATEST_FLEXISIP
          fi
          if [[ "$LATEST_CONFERENCE" != "$CUR_CONFERENCE" ]]; then
            update_conference=$LATEST_CONFERENCE
          fi

          needs_build=false
          if [[ -n "$update_flexisip" || -n "$update_conference" ||
                "$CUR_FLEXISIP" != "$built_flexisip" ||
                "$CUR_CONFERENCE" != "$built_conference" ]]; then
            needs_build=true
          fi

          {
            echo "update_flexisip=$update_flexisip"
            echo "update_conference=$update_conference"
            echo "needs_build=$needs_build"
          } >> "$GITHUB_OUTPUT"
          echo "current: $CUR_FLEXISIP / $CUR_CONFERENCE"
          echo "latest:  $LATEST_FLEXISIP / $LATEST_CONFERENCE"
          echo "built:   $built_flexisip / $built_conference"
          echo "build needed: $needs_build"

      - name: Update candidate versions
        if: ${{ steps.decide.outputs.update_flexisip != '' || steps.decide.outputs.update_conference != '' }}
        env:
          UPDATE_FLEXISIP: ${{ steps.decide.outputs.update_flexisip }}
          UPDATE_CONFERENCE: ${{ steps.decide.outputs.update_conference }}
          CURRENT_FLEXISIP: ${{ steps.current.outputs.flexisip }}
          CURRENT_CONFERENCE: ${{ steps.current.outputs.conference }}
        run: |
          set -euo pipefail
          flexisip=$UPDATE_FLEXISIP
          conference=$UPDATE_CONFERENCE
          if [[ -z "$flexisip" ]]; then
            flexisip=$CURRENT_FLEXISIP
          fi
          if [[ -z "$conference" ]]; then
            conference=$CURRENT_CONFERENCE
          fi
          {
            echo "FLEXISIP_VERSION=$flexisip"
            echo "FLEXISIP_CONFERENCE_VERSION=$conference"
          } > versions.env

      - name: Commit candidate versions
        if: ${{ steps.decide.outputs.update_flexisip != '' || steps.decide.outputs.update_conference != '' }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add versions.env
          git commit -m "bump: update upstream candidate versions"
          git push origin HEAD:main

      - name: Trigger candidate build
        if: ${{ steps.decide.outputs.needs_build == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref main
