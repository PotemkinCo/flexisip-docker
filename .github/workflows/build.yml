name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - versions.env
      - docker/**
      - scripts/ci/**
      - scripts/gitlab-proxy.js
      - scripts/package.json
      - scripts/package-lock.json
      - .github/workflows/build.yml

concurrency:
  group: flexisip-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: potemkinco

permissions:
  contents: read

jobs:
  build-proxy-image:
    name: build and push proxy image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout meta-repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read candidate version
        run: |
          set -euo pipefail
          . ./versions.env
          echo "FLEXISIP_VERSION=$FLEXISIP_VERSION" >> "$GITHUB_ENV"

      - name: Prepare upstream source
        run: ./scripts/ci/prepare-upstream.sh flexisip "$FLEXISIP_VERSION" src-proxy

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login "$REGISTRY" \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push versioned image
        run: |
          set -euo pipefail
          docker buildx create --name flexisip-builder --use
          docker buildx build \
            --file docker/proxy/Dockerfile \
            --network host \
            --tag "$REGISTRY/$IMAGE_OWNER/flexisip-proxy:$FLEXISIP_VERSION" \
            --label org.opencontainers.image.title=flexisip-proxy \
            --label org.opencontainers.image.description="SIP proxy (unofficial community build) for PotemkinCo" \
            --label org.opencontainers.image.licenses=AGPL-3.0 \
            --label org.opencontainers.image.source=https://github.com/PotemkinCo/flexisip-docker \
            --label org.opencontainers.image.vendor=PotemkinCo \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push .

  build-conference-image:
    name: build and push conference image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout meta-repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read candidate version
        run: |
          set -euo pipefail
          . ./versions.env
          echo "FLEXISIP_CONFERENCE_VERSION=$FLEXISIP_CONFERENCE_VERSION" >> "$GITHUB_ENV"

      - name: Prepare upstream source
        run: ./scripts/ci/prepare-upstream.sh flexisip-conference "$FLEXISIP_CONFERENCE_VERSION" src-conf

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login "$REGISTRY" \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push versioned image
        run: |
          set -euo pipefail
          docker buildx create --name flexisip-builder --use
          docker buildx build \
            --file docker/conference/Dockerfile \
            --network host \
            --tag "$REGISTRY/$IMAGE_OWNER/flexisip-conference:$FLEXISIP_CONFERENCE_VERSION" \
            --label org.opencontainers.image.title=flexisip-conference \
            --label org.opencontainers.image.description="Conference server (unofficial community build) for PotemkinCo, with EKT plugin for E2EE" \
            --label org.opencontainers.image.licenses=AGPL-3.0 \
            --label org.opencontainers.image.source=https://github.com/PotemkinCo/flexisip-docker \
            --label org.opencontainers.image.vendor=PotemkinCo \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push .

  smoke-test:
    name: smoke test images
    runs-on: ubuntu-24.04
    needs: [build-proxy-image, build-conference-image]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout meta-repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read candidate versions
        run: |
          set -euo pipefail
          . ./versions.env
          {
            echo "FLEXISIP_VERSION=$FLEXISIP_VERSION"
            echo "FLEXISIP_CONFERENCE_VERSION=$FLEXISIP_CONFERENCE_VERSION"
          } >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login "$REGISTRY" \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Verify images
        run: ./scripts/ci/verify-images.sh

  publish-state:
    name: publish built candidate state
    runs-on: ubuntu-24.04
    needs: [build-proxy-image, build-conference-image, smoke-test]
    permissions:
      contents: write
    steps:
      - name: Checkout meta-repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read candidate versions
        run: |
          set -euo pipefail
          . ./versions.env
          {
            echo "FLEXISIP_VERSION=$FLEXISIP_VERSION"
            echo "FLEXISIP_CONFERENCE_VERSION=$FLEXISIP_CONFERENCE_VERSION"
          } >> "$GITHUB_ENV"

      - name: Update built state
        run: |
          set -euo pipefail
          jq --arg flexisip "$FLEXISIP_VERSION" \
             --arg conference "$FLEXISIP_CONFERENCE_VERSION" \
             '.flexisip = $flexisip | ."flexisip-conference" = $conference' \
             state/built.json > state/built.json.new
          mv state/built.json.new state/built.json

      - name: Commit built state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- state/built.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add state/built.json
          git commit -m "state: record built versions ($FLEXISIP_VERSION / $FLEXISIP_CONFERENCE_VERSION)"
          git push origin HEAD:main
